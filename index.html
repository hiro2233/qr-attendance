<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA ASISTENCIA</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
    <h2>SISTEMA ASISTENCIA</h2>
    
    <div id="reader"></div>
    
    <div id="preview">
        <p><span class="label">Estudiante:</span> <span id="viewNombre" class="data">---</span></p>
        <div class="row">
            <div class="col"><p><span class="label">Curso:</span> <span id="viewCurso" class="data">---</span></p></div>
            <div class="col"><p><span class="label">Materia:</span> <span id="viewMateria" class="data">---</span></p></div>
        </div>

        <div id="incidenciasSection">
            <span class="label">Control de Materiales (SER):</span>
            <div class="checkbox-group">
                <label class="check-item">
                    <input type="checkbox" id="checkAula"> Olvido en Aula (-2)
                </label>
                <label class="check-item">
                    <input type="checkbox" id="checkCasa"> Olvido en Casa (-5)
                </label>
            </div>
            
            <span class="label">Gestión de Tiempos:</span>
            <div class="btn-group">
                <button class="btn-incidencia btn-permiso" id="btnPermiso">SALIDA BAÑO/AULA</button>
                <button class="btn-incidencia btn-reset" id="btnReset">LIMPIAR FICHA</button>
            </div>
        </div>
    </div>

    <button id="btnEnviar">CONFIRMAR ASISTENCIA</button>
    
    <div id="status">Esperando código QR...</div>

    <script src="script.js"></script>
</body>
</html>
